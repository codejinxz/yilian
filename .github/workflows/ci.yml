name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (JDK 21 / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 测试库口令按次生成（016 待批项，cifix-20261104 落地）：run_id + run_attempt 每次
    # 运行唯一。service 容器先于任何 step 启动，无法引用 step 产物，这是唯一可让
    # service 与测试拿到同一口令的「每运行随机」注入点；口令只存活在本次 runner 的
    # 临时容器里，任务结束即销毁，不进仓库、不进缓存。
    env:
      YILIAN_TEST_DB_HOST: 127.0.0.1
      YILIAN_TEST_DB_PORT: "3306"
      YILIAN_TEST_DB_USERNAME: root
      YILIAN_TEST_DB_PASSWORD: yilian-ci-${{ github.run_id }}-${{ github.run_attempt }}
      YILIAN_TEST_DB_NAME: yilian_test

    # CI 使用专用测试 MySQL；测试通过 YILIAN_TEST_DB_* 覆盖连接，不依赖开发机配置。
    # Redis 当前未参与测试（缓存仅 L1 Caffeine，refresh 会话走 Spring Session JDBC）。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: yilian-ci-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pyilian-ci-${{ github.run_id }}-${{ github.run_attempt }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Checkstyle 绑定在 validate 阶段，mvn test 会先执行；规则只覆盖 tab/行尾空白/
      # 文件末尾换行，存量代码零违规，不会无意义阻塞构建。
      - name: Maven test (Checkstyle + unit/integration tests)
        run: mvn -B test

      # google-java-format 已对全量 Java 文件归一，此后格式化是阻断门禁。
      - name: google-java-format check
        run: mvn -B fmt:check

      # 测试失败诊断：无论成败收集 surefire 报告与 Jacoco 产物。本地 mvn test 全绿而
      # CI Server job 挂时，无日志无法定因（MySQL 8.4 容器 vs 本机 8.0 / 资源时序），
      # 先留证据再下结论。artifact 名带 run_id，7 天自动过期，不留长期痕迹。
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-diagnostics-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            server/target/surefire-reports/
            server/target/jacoco.exec
            server/target/site/jacoco/

      # 失败时把 surefire 摘要写进 step summary：公开仓库匿名可读，无需 token 下载
      # artifact 也能快速定位到失败用例；输出截断防止巨量堆栈刷屏。
      - name: Print test summary
        if: failure()
        run: |
          {
            echo "## Server 测试摘要（Tests run / FAIL 行）"
            echo '```'
            grep -E "Tests run|FAIL" target/surefire-reports/*.txt 2>/dev/null | head -100 || echo "（无 surefire 报告，测试可能未产出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Web (Node 24 / pnpm 12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # v6 / v5：Node 24 运行时（Node 20 已于 2026-09 从 runner 移除，v4 会告警）。
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # lockfile 与 package.json 都在 web/ 下，--dir 指向后安装与脚本执行均在 web 内。
      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Comment discipline check (TS/TSX + migration SQL)
        run: pnpm --dir web check:comments

      - name: Build (tsc + vite build)
        run: pnpm --dir web build

      - name: Test
        run: pnpm --dir web test

      - name: Biome check
        run: pnpm --dir web biome check
