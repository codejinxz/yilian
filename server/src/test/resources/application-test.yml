# ---------------------------------------------------------------------------
# 集成测试专用配置（随代码入库）。
#
# 为什么存在：集成测试若以 local profile 启动，会依赖被 .gitignore 排除的
# server/config/application-local.yml 提供 bootstrap 口令，CI 干净检出上必然失败；
# 各测试类也不得硬编码本机口令（密钥不入库）。
#
# 使用方式：测试类统一 @ActiveProfiles("test")，数据源与口令全部按「环境变量 >
# 文档化 dev 默认值」读取。口令分三层：本机缺省回落到文档化的 dev
# 默认值 root/123456（本机即开即测；该值是公开文档化本机
# 开发凭据，不是机密）；开发者可用 YILIAN_TEST_DB_* 覆盖；CI 必须用
# YILIAN_TEST_DB_PASSWORD 注入每次运行的随机口令。dev 默认值仅限本机开发，
# 禁止复用到共享/生产环境。
# ---------------------------------------------------------------------------
spring:
  datasource:
    # 独立测试库 yilian_test，不读写开发库 yilian；连接参数与 application.yml 的
    # 开发库口径一致（UTC 会话时区）。
    url: jdbc:mysql://${YILIAN_TEST_DB_HOST:localhost}:${YILIAN_TEST_DB_PORT:3306}/${YILIAN_TEST_DB_NAME:yilian_test}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${YILIAN_TEST_DB_USERNAME:root}
    # 缺省回落到文档化的本机 dev 默认值（非机密，仅限本机开发；CI 必须用环境变量
    # 覆盖注入随机口令），与 TestDatabases 的建库连接同源。
    password: ${YILIAN_TEST_DB_PASSWORD:123456}

server:
  servlet:
    session:
      cookie:
        # 集成测试走明文 HTTP（RANDOM_PORT / MockMvc），refresh Cookie 不能带 Secure。
        secure: false

yilian:
  security:
    jwt:
      # 测试专用签名密钥（≥32 字节、非占位词、熵足够）；JwtConfiguration 只允许
      # local profile 使用 local-dev-only 前缀，因此测试值不带该前缀。
      secret: ${YILIAN_TEST_JWT_SECRET:test-only-yilian-jwt-secret-0123456789abcdef}
    provider-key:
      # 测试专用主密钥（027B provider 条目 API Key 加密入库）；口径同上：≥32 字节原始口令
      # （SHA-256 派生），不带 local-dev-only 前缀，CI 可用 YILIAN_TEST_MASTER_KEY 覆盖。
      master-key: ${YILIAN_TEST_MASTER_KEY:test-only-yilian-master-key-0123456789abcdef}
  bootstrap-admin:
    enabled: true
    username: ${YILIAN_BOOTSTRAP_ADMIN_USERNAME:admin}
    # 测试库的 bootstrap 口令；与生产无关，可通过环境变量覆盖。
    password: ${YILIAN_BOOTSTRAP_ADMIN_PASSWORD:test-admin-password}
