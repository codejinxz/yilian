# 生产环境：所有密钥都必须来自环境变量；占位符缺失或仍使用本地默认密码时，启动即失败。
spring:
  datasource:
    url: ${YILIAN_DB_URL}
    username: ${YILIAN_DB_USERNAME}
    password: ${YILIAN_DB_PASSWORD}

server:
  # native = Tomcat RemoteIpValve；只有 internal-proxies 中的代理才能改写客户端 IP。
  # 反向代理必须用 $remote_addr 覆盖 X-Forwarded-For，不能追加客户端自带值。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${YILIAN_TRUSTED_PROXY_REGEX:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|127\.0\.0\.1}'
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict

yilian:
  registration:
    # 生产默认关闭开放注册，必须由管理员发码。
    invite-required: ${YILIAN_REGISTRATION_INVITE_REQUIRED:true}
  security:
    jwt:
      secret: ${YILIAN_JWT_SECRET}
  bootstrap-admin:
    enabled: ${YILIAN_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${YILIAN_BOOTSTRAP_ADMIN_USERNAME}
    password: ${YILIAN_BOOTSTRAP_ADMIN_PASSWORD}

management:
  endpoint:
    health:
      show-details: never

logging:
  # 结构化 JSON 日志仅在 prod 启用（供日志采集器解析，含 traceId 等 MDC 字段）；
  # local 控制台保持 Spring Boot 默认的人类可读格式。
  structured:
    format:
      console: logstash
  level:
    root: INFO
    io.github.codejinxz.yilian: INFO
