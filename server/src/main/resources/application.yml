spring:
  application:
    name: yilian-server
  autoconfigure:
    # 本项目在 AuthServiceImpl 中显式完成认证；若不排除该自动配置，
    # 会自动生成一个带随机密码的内存用户，并可能把密码写进生产日志。
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${YILIAN_DB_URL:jdbc:mysql://localhost:3306/yilian?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${YILIAN_DB_USERNAME:yilian}
    password: ${YILIAN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${YILIAN_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      # 导入接口单文件上限 5MB；请求体多留 1MB 给 multipart 边界与表单字段。
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    # refresh token 的有效期；access token 只存活 15 分钟。
    timeout: 30d
    jdbc:
      initialize-schema: never
      table-name: spring_session
      # 每小时清理过期会话，避免 spring_session 行长期堆积。
      cleanup-cron: "0 0 * * * *"
  data:
    redis:
      host: ${YILIAN_REDIS_HOST:localhost}
      port: ${YILIAN_REDIS_PORT:6379}
      password: ${YILIAN_REDIS_PASSWORD:}
      timeout: 2s
  threads:
    virtual:
      enabled: true
  jackson:
    # 必须是 always：失败响应同样要输出 data（值为 null），前端才能按 Result 统一解析。
    default-property-inclusion: always

server:
  port: ${YILIAN_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: ${YILIAN_REFRESH_COOKIE_NAME:YILIAN_REFRESH}
        http-only: true
        same-site: strict
        secure: true
        path: /api/auth
        max-age: 30d
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Redis L2 尚未接入业务缓存/限流；关闭其健康指示器，避免把未使用的依赖变成 prod 硬依赖。
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: yilian-server
    version: "@project.version@"

yilian:
  registration:
    # prod 默认强制邀请码；local 可在 application-local.yml 关闭，方便本机联调。
    invite-required: ${YILIAN_REGISTRATION_INVITE_REQUIRED:false}
  security:
    jwt:
      issuer: ${YILIAN_JWT_ISSUER:yilian}
      # 空值会让 JwtConfiguration 启动失败；local 在 application-local.yml 提供开发默认值。
      secret: ${YILIAN_JWT_SECRET:}
      access-token-ttl: ${YILIAN_JWT_ACCESS_TTL:15m}
  bootstrap-admin:
    enabled: ${YILIAN_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${YILIAN_BOOTSTRAP_ADMIN_USERNAME:admin}
    # 默认为空：local 由 application-local.yml 提供文档化的默认值，prod 必须显式给
    # 环境变量，并且拒绝默认值。
    password: ${YILIAN_BOOTSTRAP_ADMIN_PASSWORD:}
    # 一次性找回开关：启动时重置已有管理员的密码，用完立即改回 false。
    reset-password-on-startup: ${YILIAN_BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    io.github.codejinxz.yilian: INFO
