spring:
  application:
    name: yilian-server
  autoconfigure:
    # 本项目在 AuthServiceImpl 中显式完成认证；若不排除该自动配置，
    # 会自动生成一个带随机密码的内存用户，并可能把密码写进生产日志。
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ai:
    model:
      # 017：spring-ai-starter-model-openai 只作为手工装配 ChatClient 的依赖引入（见
      # practice/llm/TutorLlmConfiguration），其全部自动配置在此关闭，避免 starter 在缺省凭证下
      # 自行拼出空凭证的模型 bean。凭证走 YILIAN_LLM_*，由 TutorLlmConfiguration 按凭证存在性惰性装配。
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  datasource:
    url: ${YILIAN_DB_URL:jdbc:mysql://localhost:3306/yilian?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${YILIAN_DB_USERNAME:yilian}
    password: ${YILIAN_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${YILIAN_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      # 导入接口单文件上限 5MB；请求体多留 1MB 给 multipart 边界与表单字段。
      max-file-size: 5MB
      max-request-size: 6MB
  session:
    # refresh token 的有效期；access token 只存活 15 分钟。
    timeout: 30d
    jdbc:
      initialize-schema: never
      table-name: spring_session
      # 每小时清理过期会话，避免 spring_session 行长期堆积。
      cleanup-cron: "0 0 * * * *"
  data:
    redis:
      host: ${YILIAN_REDIS_HOST:localhost}
      port: ${YILIAN_REDIS_PORT:6379}
      password: ${YILIAN_REDIS_PASSWORD:}
      # 连接超时（016 P2·04#03）：只有命令超时(timeout)时，黑洞网络下建连阶段会阻塞到 TCP
      # 层超时（可达数十秒），限流/缓存的 fail-open 承诺失效、主链路被拖死。两个超时共同
      # 限定 Redis 故障的最坏阻塞窗口；到时后按既有降级语义处理（限流 fail-open、缓存回源 DB）。
      connect-timeout: 2s
      # 命令超时：到时抛查询超时异常，调用方按 fail-open / 回源降级，不阻塞主链路。
      timeout: 2s
  threads:
    virtual:
      # 015 压测实证（docs/analysis/api-test-015/perf-report.md §3）：开启虚拟线程后
      # 10~50 并发读在 1~2 秒内触发 JVM 原生崩溃（0xC0000005，4 次复现且无 hs_err）；
      # 关闭后同场景 2693 req/s 零错误稳定跑通。因此默认关闭；
      # 目标部署环境（Linux + 生产 JDK）重测通过后再评估开启。
      enabled: false
  jackson:
    # 必须是 always：失败响应同样要输出 data（值为 null），前端才能按 Result 统一解析。
    default-property-inclusion: always

server:
  port: ${YILIAN_SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      cookie:
        name: ${YILIAN_REFRESH_COOKIE_NAME:YILIAN_REFRESH}
        http-only: true
        same-site: strict
        secure: true
        path: /api/auth
        max-age: 30d
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Redis L2 尚未接入业务缓存/限流；关闭其健康指示器，避免把未使用的依赖变成 prod 硬依赖。
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: yilian-server
    version: "@project.version@"

yilian:
  llm:
    # 017 题目答疑：LLM 接入。三态——无可用客户端=功能不存在；已配置但后台未开启=40304；开启=可用。
    # 详见 PRD §5.4 与 docs/API.md §6.12/§8.14/§8.15。
    # 022 起 LLM 接入首选 provider 目录（app_settings 键 llm.providers/llm.active，管理端 /api/admin/llm/providers
    # 管理，协议三选一 anthropic-messages|openai-chat|openai-responses）；密钥按 provider id 走
    # YILIAN_LLM_KEY_<大写ID>（连字符→下划线，如 zcode-gateway→YILIAN_LLM_KEY_ZCODE_GATEWAY），不入库。
    # 本节为 legacy 单 provider 兼容轨：目录为空且以下凭证齐备时按隐式 provider 生效（读路径兼容 017/021）。
    provider: ${YILIAN_LLM_PROVIDER:openai}
    # 端点按 provider 分拼接口径（021）：openai 填到 /v4 级前缀（如智谱 https://open.bigmodel.cn/api/paas/v4）；
    # anthropic 填到网关前缀（如 http://127.0.0.1:47860/gateway/zcode），/v1/messages 由客户端拼接。
    base-url: ${YILIAN_LLM_BASE_URL:}
    # 密钥只进环境变量（AGENTS §3.4），不落库、不进配置文件；后台接口只回 hasKey 布尔。
    # openai 轨必填；anthropic 轨可空（ZCode 网关本机无鉴权，非空时以 x-api-key 头携带）。
    api-key: ${YILIAN_LLM_API_KEY:}
    # openai 轨缺省 glm-4.7；ZCode 网关用 YILIAN_LLM_MODEL=glm-5.3 覆盖。
    model: ${YILIAN_LLM_MODEL:glm-4.7}
    # 单次调用超时：超时/异常统一降级为「答疑暂时不可用」，不阻塞答题主链路。
    timeout: ${YILIAN_LLM_TIMEOUT:15s}
  admin:
    # 管理端 from/to 日期筛选的日界时区（管理员视角的「本地日」，012/015 观察项修复：
    # 前端按浏览器本地日发送日期，服务端按 UTC 日界换算会在凌晨漏掉「今天」的记录）。
    # 单产品默认 Asia/Shanghai；analytics 的 from/to 另按用户自己的时区换算（用户设置）。
    day-zone: ${YILIAN_ADMIN_DAY_ZONE:Asia/Shanghai}
  registration:
    # prod 默认强制邀请码；local 可在 application-local.yml 关闭，方便本机联调。
    invite-required: ${YILIAN_REGISTRATION_INVITE_REQUIRED:false}
  security:
    captcha:
      # 登录/注册图形验证码；关闭时前后端都不出图形码（本地联调/自动化测试）。
      enabled: ${YILIAN_SECURITY_CAPTCHA_ENABLED:true}
    jwt:
      issuer: ${YILIAN_JWT_ISSUER:yilian}
      # 空值会让 JwtConfiguration 启动失败；local 在 application-local.yml 提供开发默认值。
      secret: ${YILIAN_JWT_SECRET:}
      access-token-ttl: ${YILIAN_JWT_ACCESS_TTL:15m}
  bootstrap-admin:
    enabled: ${YILIAN_BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${YILIAN_BOOTSTRAP_ADMIN_USERNAME:admin}
    # 默认为空：local 由 application-local.yml 提供文档化的默认值，prod 必须显式给
    # 环境变量，并且拒绝默认值。
    password: ${YILIAN_BOOTSTRAP_ADMIN_PASSWORD:}
    # 一次性找回开关：启动时重置已有管理员的密码，用完立即改回 false。
    reset-password-on-startup: ${YILIAN_BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# MyBatis 只承载复杂查询/统计的只读 Dao（AGENTS §3.1）：写操作与单表 CRUD 走 JPA。
# Mapper 接口集中在各模块 dao.mybatis 包，由 common/config/MyBatisConfig 的 @MapperScan 注册；
# SQL 写在 classpath:mapper/ 下的 XML 里，动态筛选与 JOIN 不散落在注解中。
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 只读 DTO 用 Java record（无 setter）：开启按参数名的构造映射，配合 Boot 默认的 -parameters 编译参数。
    arg-name-based-constructor-auto-mapping: true
    # 只读查询不需要跨语句共享结果；二级缓存交给 Caffeine/Redis 分层（AGENTS §3.8），MyBatis 侧关闭。
    cache-enabled: false

logging:
  level:
    root: INFO
    io.github.codejinxz.yilian: INFO
